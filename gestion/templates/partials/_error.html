{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ codigo }} · AeroVigía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="relative flex min-h-full flex-col overflow-x-hidden bg-[#050a12] font-sans text-slate-100 antialiased">
    <div class="pointer-events-none fixed inset-0 login-grid opacity-30"></div>
    <div class="pointer-events-none fixed -left-40 top-[-10rem] h-[32rem] w-[32rem] rounded-full bg-cyan-500/10 blur-[120px]"></div>
    <div class="pointer-events-none fixed -right-40 bottom-[-14rem] h-[36rem] w-[36rem] rounded-full bg-teal-500/10 blur-[130px]"></div>

    <div class="relative mx-auto flex min-h-screen w-full max-w-3xl flex-col px-5 py-6 sm:px-8">
        <header class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-400 to-teal-600 text-slate-950 shadow-glow">
                <svg class="h-6 w-6" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7">
                    <ellipse cx="7.5" cy="7.5" rx="4" ry="1.7"/>
                    <ellipse cx="24.5" cy="7.5" rx="4" ry="1.7"/>
                    <ellipse cx="7.5" cy="24.5" rx="4" ry="1.7"/>
                    <ellipse cx="24.5" cy="24.5" rx="4" ry="1.7"/>
                    <path d="M10 10l4 4m8-4-4 4m-8 8 4-4m8 4-4-4" stroke-linecap="round"/>
                    <rect x="13" y="12.5" width="6" height="7" rx="2"/>
                    <circle cx="16" cy="19.5" r="1" fill="currentColor" stroke="none"/>
                </svg>
            </div>
            <div>
                <p class="font-display text-lg font-bold leading-none tracking-tight">AeroVigía</p>
                <p class="mt-1 text-[10px] uppercase tracking-[0.18em] text-slate-500">Control de operaciones</p>
            </div>
        </header>

        <main class="flex flex-1 items-center py-12">
            <div class="w-full rounded-3xl border border-white/[0.08] bg-slate-900/70 p-7 shadow-2xl backdrop-blur-xl sm:p-10">
                <div class="absolute inset-x-8 top-0 h-px bg-gradient-to-r from-transparent via-cyan-400/50 to-transparent"></div>
                <p class="font-mono text-[11px] font-semibold uppercase tracking-[0.28em] text-cyan-400">Error {{ codigo }}</p>
                <p class="mt-2 font-display text-6xl font-bold leading-none tracking-tight text-white sm:text-7xl">{{ codigo }}</p>
                <h1 class="mt-5 max-w-lg font-display text-2xl font-bold tracking-tight text-white">{{ titulo }}</h1>
                <p class="mt-2 max-w-lg text-sm leading-relaxed text-slate-400">{{ mensaje }}</p>
                <div class="mt-8 flex flex-col gap-2 sm:flex-row">
                    <a href="/" class="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-cyan-400 to-teal-400 px-5 py-3 text-sm font-bold text-slate-950 transition hover:from-cyan-300 hover:to-teal-300">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
                        Volver al inicio
                    </a>
                    <a href="/login/" class="inline-flex items-center justify-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-5 py-3 text-sm font-semibold text-slate-300 transition hover:bg-white/[0.07] hover:text-white">
                        Iniciar sesión
                    </a>
                </div>
            </div>
        </main>

        <footer class="pb-4 text-[11px] text-slate-600">
            AeroVigía · Sistema de gestión de vigilancia con drones
        </footer>
    </div>
</body>
</html>
