<div class="flex items-start gap-3 rounded-xl border border-white/[0.06] bg-white/[0.02] px-3.5 py-3">
    {{ campo }}
    <div class="min-w-0">
        <label for="{{ campo.id_for_label }}" class="cursor-pointer text-sm font-medium text-slate-200">{{ campo.label }}</label>
        {% if campo.help_text %}<p class="mt-0.5 text-[11px] text-slate-500">{{ campo.help_text }}</p>{% endif %}
        {% for error in campo.errors %}<p class="mt-1 text-[11px] text-rose-300">{{ error }}</p>{% endfor %}
    </div>
</div>
